<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ভোটার সহায়ক — খুঁজুন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --field-green:#0B2E23; --field-green-deep:#06201A;
    --disc-red:#C8352E; --paper:#F4F0E6; --paper-dim:#C9C2AC;
    --gold:#C9A24B; --ok:#3FAE7A; --line:rgba(244,240,230,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--field-green-deep); color:var(--paper);
    font-family:'Noto Sans Bengali',sans-serif; height:100dvh; width:100vw; overflow:hidden;}
  button,input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .screen{position:relative; height:100dvh; width:100vw; overflow:hidden; display:flex; flex-direction:column;}

  /* ---------- Login ---------- */
  .login-screen{position:absolute; inset:0; z-index:50; background:var(--field-green-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; gap:16px; text-align:center;}
  .login-screen h1{font-size:19px; margin:0;}
  .login-screen p{font-size:13.5px; color:var(--paper-dim); margin:0; max-width:300px; line-height:1.6;}
  .login-form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .login-form input{padding:13px 14px; border-radius:10px; background:rgba(244,240,230,0.06);
    border:1px solid var(--line); color:var(--paper); font-size:15px;}
  .primary-btn{background:var(--disc-red); color:var(--paper); border:none; padding:13px 20px;
    border-radius:999px; font-size:15px; font-weight:600; cursor:pointer;}
  .error-text{color:#E8897F; font-size:13px; min-height:16px;}

  /* ---------- Header ---------- */
  .topbar{padding:max(14px,env(safe-area-inset-top)) 18px 12px; display:flex; align-items:center;
    justify-content:space-between; background:rgba(6,32,26,0.9); border-bottom:1px solid var(--line); flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--paper-dim);}
  .brand .dot{width:7px; height:7px; border-radius:50%; background:var(--disc-red);}
  .signout-btn{background:none; border:1px solid var(--line); color:var(--paper-dim); font-size:12px;
    padding:6px 12px; border-radius:999px; cursor:pointer;}

  .tabs{display:flex; gap:6px; padding:10px 14px; background:rgba(6,32,26,0.6); flex-shrink:0;}
  .tab-btn{flex:1; padding:10px 6px; border-radius:10px; border:1px solid var(--line); background:transparent;
    color:var(--paper-dim); font-size:12.5px; cursor:pointer;}
  .tab-btn.active{background:var(--gold); color:#241a06; border-color:var(--gold); font-weight:600;}

  .tab-panel{display:none; flex:1; overflow-y:auto; padding:14px 16px 24px;}
  .tab-panel.active{display:block;}

  .search-input{width:100%; padding:13px 14px; border-radius:10px; background:rgba(244,240,230,0.06);
    border:1px solid var(--line); color:var(--paper); font-size:15px; margin-bottom:14px;}
  .status-line{font-size:12px; color:var(--paper-dim); font-family:'JetBrains Mono',monospace; margin-bottom:10px;}

  .result-card{background:rgba(244,240,230,0.05); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px;}
  .result-card.match-exact{border-color:var(--ok); background:rgba(63,174,122,0.08);}
  .serial-badge{display:inline-block; background:var(--gold); color:#241a06; font-weight:700; font-size:13px;
    padding:4px 10px; border-radius:8px; font-family:'JetBrains Mono',monospace; margin-bottom:8px;}
  .r-name{font-size:16px; font-weight:600; margin-bottom:4px;}
  .r-line{font-size:13px; color:var(--paper-dim); margin-bottom:2px;}
  .r-nid{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--gold);}

  /* ---------- NID scan tab (reused camera UI) ---------- */
  .cam-wrap{position:relative; width:100%; aspect-ratio:3/4; border-radius:14px; overflow:hidden;
    background:#000; margin-bottom:14px;}
  .cam-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
  .card-cut{position:absolute; inset:8%; border-radius:12px; border:1.5px solid rgba(244,240,230,0.5); pointer-events:none;}
  .focus-band{position:absolute; left:11%; right:11%; bottom:16%; height:22%; border:1.5px dashed var(--disc-red);
    border-radius:5px; background:rgba(200,53,46,0.12); pointer-events:none;}
  .cam-controls{display:flex; justify-content:center; margin-bottom:14px;}
  .shutter{width:62px; height:62px; border-radius:50%; background:var(--paper); border:4px solid rgba(244,240,230,0.35);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .shutter-inner{width:48px; height:48px; border-radius:50%; background:var(--disc-red);}
  .shutter:active .shutter-inner{transform:scale(0.88);}

  .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(244,240,230,0.2);
    border-top-color:var(--gold); animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .empty-hint{color:var(--paper-dim); font-size:13.5px; text-align:center; padding:24px 10px;}

  /* ---------- Scan-match popup ---------- */
  .popup-overlay{position:fixed; inset:0; z-index:60; background:rgba(6,32,26,0.82);
    display:none; align-items:center; justify-content:center; padding:20px;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);}
  .popup-overlay.open{display:flex;}
  .popup-card{width:100%; max-width:360px; max-height:85vh; overflow-y:auto; background:var(--field-green);
    border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .popup-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .popup-head h3{font-size:15px; margin:0; color:var(--ok);}
  .popup-close{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:transparent;
    color:var(--paper); font-size:16px; cursor:pointer; flex-shrink:0;}
  .popup-rescan-btn{width:100%; margin-top:6px; padding:12px; border-radius:10px; background:var(--disc-red);
    color:var(--paper); border:none; font-size:14px; font-weight:600; cursor:pointer;}

  .dev-credit{position:absolute; left:0; right:0; bottom:4px; text-align:center; font-size:10px;
    color:rgba(244,240,230,0.35); z-index:5; pointer-events:none;}
  .dev-credit a{color:rgba(201,162,75,0.6); pointer-events:auto; text-decoration:none;}
</style>
</head>
<body>

<div class="screen">

  <div class="login-screen" id="loginScreen">
    <h1>ভোটার সহায়ক</h1>
    <p>শুধু অনুমোদিত বুথ এজেন্টরা লগইন করে সার্চ করতে পারবে।</p>
    <div class="login-form">
      <input type="email" id="loginEmail" placeholder="ইমেইল" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড" autocomplete="current-password">
      <button class="primary-btn" id="loginBtn">লগইন করুন</button>
      <div class="error-text" id="loginError"></div>
    </div>
  </div>

  <div class="topbar">
    <div class="brand"><span class="dot"></span> ভোটার সহায়ক</div>
    <button class="signout-btn" id="signoutBtn">লগআউট</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="nameTab">নাম দিয়ে</button>
    <button class="tab-btn" data-tab="nidTab">NID স্ক্যান</button>
    <button class="tab-btn" data-tab="yearTab">জন্ম সাল দিয়ে</button>
    <button class="tab-btn" data-tab="serialTab">ক্রমিক নং</button>
  </div>

  <div class="tab-panel active" id="nameTab">
    <div class="status-line" id="loadStatus">ডেটা লোড হচ্ছে...</div>
    <input class="search-input" id="nameSearchInput" placeholder="নাম লিখুন...">
    <div id="nameResults"></div>
  </div>

  <div class="tab-panel" id="nidTab">
    <div class="cam-wrap">
      <video id="scanVideo" autoplay playsinline muted></video>
      <div class="card-cut" id="cardCut"></div>
      <div class="focus-band" id="focusBand"></div>
    </div>
    <div class="cam-controls">
      <button class="shutter" id="scanShutterBtn"><div class="shutter-inner"></div></button>
    </div>
    <div class="status-line" id="scanStatus">NID কার্ডের NID নম্বর ও জন্মতারিখ — দুটোই ফ্রেমের মধ্যে স্পষ্ট রেখে ক্যাপচার করুন</div>
  </div>

  <div class="tab-panel" id="yearTab">
    <select class="search-input" id="yearSelect"><option value="">জন্ম সাল বেছে নিন</option></select>
    <input class="search-input" id="yearNameFilter" placeholder="নাম দিয়ে আরও ছোট করুন (ঐচ্ছিক)" style="display:none;">
    <div id="yearResults"></div>
  </div>

  <div class="tab-panel" id="serialTab">
    <input class="search-input" id="serialSearchInput" placeholder="ক্রমিক নং লিখুন... (যেমন 0004)" inputmode="numeric">
    <div id="serialResults"></div>
  </div>

  <div class="dev-credit">Developer: <a href="https://mohasin.bro.bd" target="_blank" rel="noopener">CSM Mohasin Alam</a></div>

</div>

<div class="popup-overlay" id="matchPopupOverlay">
  <div class="popup-card">
    <div class="popup-head">
      <h3>ভোটার পাওয়া গেছে</h3>
      <button class="popup-close" id="popupCloseBtn">×</button>
    </div>
    <div id="matchPopupContent"></div>
    <button class="popup-rescan-btn" id="popupRescanBtn">আবার স্ক্যান করো</button>
  </div>
</div>

<canvas id="scanCanvas" style="display:none;"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { FIREBASE_CONFIG, VOTERS_COLLECTION, bnToEnDigits, normalizeDob, dobYear, displayDob } from "./shared.js";

const firebaseApp = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

const loginScreen = document.getElementById('loginScreen');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const signoutBtn = document.getElementById('signoutBtn');

loginBtn.addEventListener('click', async ()=>{
  loginError.textContent = '';
  loginBtn.disabled = true; loginBtn.textContent = 'লগইন হচ্ছে...';
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
  }catch(err){
    console.error(err);
    loginError.textContent = 'লগইন ব্যর্থ: ' + (err.code || err.message || 'অজানা সমস্যা');
  }finally{
    loginBtn.disabled = false; loginBtn.textContent = 'লগইন করুন';
  }
});
signoutBtn.addEventListener('click', ()=> signOut(auth));

let allVoters = [];
let voterDataLoaded = false;

onAuthStateChanged(auth, (user)=>{
  if(user){
    loginScreen.style.display = 'none';
    if(!voterDataLoaded) loadAllVoters();
  }else{
    loginScreen.style.display = 'flex';
  }
});

async function loadAllVoters(){
  const statusEl = document.getElementById('loadStatus');
  try{
    const snap = await getDocs(collection(db, VOTERS_COLLECTION));
    allVoters = [];
    snap.forEach(d => allVoters.push(d.data()));
    voterDataLoaded = true;
    statusEl.textContent = `মোট ${allVoters.length} জন ভোটারের তথ্য লোড হয়েছে`;
    populateYearSelect();
  }catch(err){
    statusEl.textContent = 'ডেটা লোড ব্যর্থ: ' + err.message;
  }
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'nidTab') startScanCamera(); else stopScanCamera();
  });
});

function renderResultCard(v, exact){
  const div = document.createElement('div');
  div.className = 'result-card' + (exact ? ' match-exact' : '');
  div.innerHTML = `
    ${v.serial ? `<div class="serial-badge">ক্রমিক নং ${v.serial}</div>` : ''}
    <div class="r-name">${escapeHtml(v.name||'')}</div>
    <div class="r-line r-nid">NID: ${escapeHtml(v.nid_number||'')}</div>
    <div class="r-line">পিতা: ${escapeHtml(v.father_name||'')} · মাতা: ${escapeHtml(v.mother_name||'')}</div>
    <div class="r-line">জন্ম তারিখ: ${escapeHtml(v.dob ? displayDob(v.dob) : '')}</div>
    <div class="r-line">${escapeHtml(v.address||'')}</div>
  `;
  return div;
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Name search ----------
const nameSearchInput = document.getElementById('nameSearchInput');
const nameResults = document.getElementById('nameResults');
let nameDebounce;
nameSearchInput.addEventListener('input', ()=>{
  clearTimeout(nameDebounce);
  nameDebounce = setTimeout(runNameSearch, 150);
});
function runNameSearch(){
  const q = nameSearchInput.value.trim();
  nameResults.innerHTML = '';
  if(!q){ return; }
  const matches = allVoters.filter(v => (v.name||'').includes(q) || (v.nid_number||'').includes(q));
  if(matches.length === 0){
    nameResults.innerHTML = '<div class="empty-hint">কোনো মিল পাওয়া যায়নি</div>';
    return;
  }
  matches.slice(0,50).forEach(v => nameResults.appendChild(renderResultCard(v,false)));
}

// ---------- Serial number search ----------
const serialSearchInput = document.getElementById('serialSearchInput');
const serialResults = document.getElementById('serialResults');
let serialDebounce;
serialSearchInput.addEventListener('input', ()=>{
  clearTimeout(serialDebounce);
  serialDebounce = setTimeout(runSerialSearch, 150);
});
function runSerialSearch(){
  const qRaw = serialSearchInput.value.trim();
  serialResults.innerHTML = '';
  if(!qRaw) return;
  const q = bnToEnDigits(qRaw).replace(/\D/g,'');
  if(!q){ serialResults.innerHTML = '<div class="empty-hint">শুধু সংখ্যা লিখুন</div>'; return; }
  const matches = allVoters.filter(v => (v.serial||'').replace(/\D/g,'').includes(q));
  if(matches.length === 0){
    serialResults.innerHTML = '<div class="empty-hint">কোনো মিল পাওয়া যায়নি</div>';
    return;
  }
  matches.slice(0,50).forEach(v => serialResults.appendChild(renderResultCard(v,false)));
}

// ---------- Year search ----------
function populateYearSelect(){
  const years = new Set();
  allVoters.forEach(v => { if(v.dob) years.add(v.dob.slice(0,4)); });
  const sel = document.getElementById('yearSelect');
  Array.from(years).sort((a,b)=>a-b).forEach(y=>{
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  });
}
document.getElementById('yearSelect').addEventListener('change', runYearSearch);
document.getElementById('yearNameFilter').addEventListener('input', runYearSearch);
function runYearSearch(){
  const year = document.getElementById('yearSelect').value;
  const filterEl = document.getElementById('yearNameFilter');
  const results = document.getElementById('yearResults');
  results.innerHTML = '';
  if(!year){ filterEl.style.display='none'; return; }
  filterEl.style.display='block';
  const nameQ = filterEl.value.trim();
  let matches = allVoters.filter(v => (v.dob||'').startsWith(year));
  if(nameQ) matches = matches.filter(v => (v.name||'').includes(nameQ));
  if(matches.length === 0){
    results.innerHTML = '<div class="empty-hint">কোনো মিল পাওয়া যায়নি</div>';
    return;
  }
  matches.slice(0,80).forEach(v => results.appendChild(renderResultCard(v,false)));
}

// ---------- NID scan search ----------
const scanVideo = document.getElementById('scanVideo');
const scanShutterBtn = document.getElementById('scanShutterBtn');
const scanCanvas = document.getElementById('scanCanvas');
const scanStatus = document.getElementById('scanStatus');
const cardCut = document.getElementById('cardCut');
const focusBand = document.getElementById('focusBand');
const matchPopupOverlay = document.getElementById('matchPopupOverlay');
const matchPopupContent = document.getElementById('matchPopupContent');
const popupCloseBtn = document.getElementById('popupCloseBtn');
const popupRescanBtn = document.getElementById('popupRescanBtn');
let scanStream = null;
let ocrReady = null;
let scansSinceInit = 0;

function openMatchPopup(voters){
  matchPopupContent.innerHTML = '';
  voters.forEach(v => matchPopupContent.appendChild(renderResultCard(v, true)));
  matchPopupOverlay.classList.add('open');
}
function closeMatchPopup(){
  matchPopupOverlay.classList.remove('open');
}
popupCloseBtn.addEventListener('click', closeMatchPopup);
popupRescanBtn.addEventListener('click', ()=>{
  closeMatchPopup();
  scanStatus.textContent = 'NID কার্ডের NID নম্বর ও জন্মতারিখ — দুটোই লাল বক্সের মধ্যে স্পষ্ট রেখে ক্যাপচার করুন';
});

async function startScanCamera(){
  if(scanStream) return;
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280, max:1280}, height:{ideal:960, max:960} }, audio:false
    });
    scanVideo.srcObject = scanStream;
  }catch(err){
    scanStatus.textContent = 'ক্যামেরা চালু করা যায়নি: ' + err.message;
  }
  if(!ocrReady) ocrReady = initScanOCR();
}
function stopScanCamera(){
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}
async function initScanOCR(){
  const { PaddleOcrService } = await import('https://esm.sh/ppu-paddle-ocr/web');
  // WebGPU-এর অটো-ব্যবহার এড়াতে CPU execution provider জোর করে সেট করা
  // হচ্ছে — ONNX Runtime-এর WebGPU backend প্রতি scan-এ বাফার ছেড়ে না দিয়ে
  // জমাতে থাকে, যেটা কম RAM-এর মোবাইল ফোনে কয়েক স্ক্যানের মধ্যেই ট্যাব
  // ক্র্যাশের একটা পরিচিত কারণ।
  const inst = new PaddleOcrService({
    session: {
      executionProviders: ['cpu'],
      enableCpuMemArena: true,
      enableMemPattern: true,
      executionMode: 'sequential'
    }
  });
  await inst.initialize();
  return inst;
}

// PaddleOCR/ONNX Runtime-এর ওয়েব বিল্ডে প্রতি recognize() কলের সাথে কিছু
// মেমোরি জমতেই থাকে (ভেতরের সেশন-লেভেল বাফার ঠিকমতো রিলিজ হয় না) — কয়েক
// স্ক্যানের মধ্যেই সেটা কম RAM-এর ফোনে ট্যাব ক্র্যাশ করানোর জন্য যথেষ্ট হয়ে
// যায়। তাই প্রতি ২টা স্ক্যানের পর পুরনো instance destroy করে নতুন করে লোড
// করা হচ্ছে — মডেল ফাইল ব্রাউজারে cache থাকায় এই re-init দ্রুতই হয়।
const SCANS_BEFORE_RECYCLE = 2;
async function getOcrInstance(){
  if(scansSinceInit >= SCANS_BEFORE_RECYCLE){
    try{
      const old = await ocrReady;
      if(old && typeof old.destroy === 'function') await old.destroy();
    }catch(_){ /* ignore cleanup errors */ }
    ocrReady = initScanOCR();
    scansSinceInit = 0;
  }
  scansSinceInit++;
  return ocrReady;
}

// স্ক্রিনে দেখানো লাল "focus-band" বক্সটার অবস্থান/সাইজ ভিডিও-এলিমেন্টের
// নেটিভ পিক্সেল কোঅর্ডিনেটে ম্যাপ করে — object-fit:cover থাকায় ভিডিওর
// আসল রেজোলিউশন আর যা স্ক্রিনে দেখা যাচ্ছে তার মধ্যে স্কেল/অফসেট থাকে,
// সেটা এখানে হিসাব করা হচ্ছে। ফলাফল: শুধু লাল বক্সের ছোট অংশটাই crop
// হয়ে OCR-এ যাবে, পুরো ফ্রেম না — এতে processing অনেক ছোট ও নিরাপদ থাকে।
function mapElementToVideoRegion(el){
  const vw = scanVideo.videoWidth, vh = scanVideo.videoHeight;
  const cw = scanVideo.clientWidth, ch = scanVideo.clientHeight;
  if(!vw || !vh) return null;

  const scale = Math.max(cw / vw, ch / vh);
  const dispW = vw * scale, dispH = vh * scale;
  const offX = (dispW - cw) / 2;
  const offY = (dispH - ch) / 2;

  const rect = el.getBoundingClientRect();
  const videoRect = scanVideo.getBoundingClientRect();
  const leftInContainer = rect.left - videoRect.left;
  const topInContainer = rect.top - videoRect.top;

  const srcX = (offX + leftInContainer) / scale;
  const srcY = (offY + topInContainer) / scale;
  const srcW = rect.width / scale;
  const srcH = rect.height / scale;

  return { srcX, srcY, srcW, srcH };
}

function enhanceForOCR(ctx,w,h){
  const imgData = ctx.getImageData(0,0,w,h); const d = imgData.data;
  let min=255,max=0;
  for(let i=0;i<d.length;i+=4){ const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; d[i]=d[i+1]=d[i+2]=g; if(g<min)min=g; if(g>max)max=g; }
  const range=Math.max(max-min,1);
  for(let i=0;i<d.length;i+=4){ const s=((d[i]-min)/range)*255; d[i]=d[i+1]=d[i+2]=s; }
  ctx.putImageData(imgData,0,0);
}

const VALID_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseDobFromText(cleaned){
  const m = cleaned.match(/(\d{1,2})\s*([A-Za-z]{3,9})\s*(\d{4})/);
  if(!m) return '';
  const day = String(parseInt(m[1],10)).padStart(2,'0');
  const monRaw = m[2].slice(0,3);
  const mon = monRaw.charAt(0).toUpperCase()+monRaw.slice(1).toLowerCase();
  if(!VALID_MONTHS.includes(mon)) return '';
  return `${day} ${mon} ${m[3]}`;
}
function parseNidFromText(cleaned){
  const clusters = cleaned.match(/\d[\d\s]{6,24}\d/g) || [];
  let best = '';
  for(const c of clusters){
    const s = c.replace(/\s/g,'');
    if(s.length >= 10 && s.length <= 17 && s.length > best.length) best = s;
  }
  return best;
}

let isScanning = false;
scanShutterBtn.addEventListener('click', ()=>{
  if(isScanning || !scanVideo.videoWidth) return;
  isScanning = true;
  scanShutterBtn.style.opacity='0.5'; scanShutterBtn.style.pointerEvents='none';
  closeMatchPopup();

  // লোডিং UI অবিলম্বে দেখানো হচ্ছে, ভারী কাজ শুরুর আগেই — setTimeout ব্যবহার
  // করা হচ্ছে (শুধু requestAnimationFrame না) কারণ কম শক্তিশালী ফোনের
  // WebView-তে এটা স্পিনার আসলেই স্ক্রিনে আঁকা নিশ্চিত করার জন্য বেশি নির্ভরযোগ্য।
  scanStatus.innerHTML = '<span class="spinner"></span> লোড হচ্ছে...';
  setTimeout(captureAndRunOCR, 60);
});

async function captureAndRunOCR(){
  try{
    const bandRegion = mapElementToVideoRegion(focusBand);
    if(!bandRegion || bandRegion.srcW <= 0 || bandRegion.srcH <= 0){
      scanStatus.textContent = 'ক্যামেরা প্রস্তুত হয়নি, একটু পর আবার চেষ্টা করো';
      return;
    }

    scanStatus.innerHTML = '<span class="spinner"></span> স্ক্যান হচ্ছে...';
    await new Promise(r => requestAnimationFrame(r));

    // শুধু লাল বক্সের (focus-band) অংশটুকুই crop করে ছোট canvas-এ আঁকা হচ্ছে —
    // পুরো ফ্রেম না। এতে canvas সবসময় ছোট থাকে, ক্যামেরার নেটিভ রেজোলিউশন
    // যত বড়ই হোক না কেন — এইটাই আগের ক্র্যাশের আসল সমাধান।
    const TARGET_W = 700;
    const scale = Math.max(0.5, Math.min(3, TARGET_W / bandRegion.srcW));
    scanCanvas.width = Math.round(bandRegion.srcW * scale);
    scanCanvas.height = Math.round(bandRegion.srcH * scale);
    const ctx = scanCanvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(
      scanVideo,
      bandRegion.srcX, bandRegion.srcY, bandRegion.srcW, bandRegion.srcH,
      0, 0, scanCanvas.width, scanCanvas.height
    );
    enhanceForOCR(ctx, scanCanvas.width, scanCanvas.height);

    const ocr = await getOcrInstance();
    const result = await ocr.recognize(scanCanvas);
    const text = bnToEnDigits((result && result.text) || '').replace(/\s+/g,' ');

    // canvas-এর pixel buffer যত দ্রুত সম্ভব ছেড়ে দেওয়ার জন্য সাইজ শূন্যে
    // নামিয়ে দেওয়া হচ্ছে, যাতে পরের scan-এর আগে আগেরটার মেমোরি জমে না থাকে
    scanCanvas.width = 0; scanCanvas.height = 0;

    const nid = parseNidFromText(text);
    const dobText = parseDobFromText(text);
    const isoDob = normalizeDob(dobText);

    // NID নম্বর আর জন্মতারিখ — দুটোই স্পষ্ট পড়া গেলে এবং দুটোই একই ভোটারের
    // সাথে মিললে তবেই রেজাল্ট দেখানো হবে (শুধু একটা মিললে না)।
    let matches = [];
    if(nid && isoDob){
      matches = allVoters.filter(v => v.nid_number === nid && v.dob === isoDob);
    }

    if(matches.length > 0){
      scanStatus.textContent = `${matches.length} জন পাওয়া গেছে`;
      openMatchPopup(matches.slice(0,10));
    }else{
      // কোনো "ম্যানুয়াল এন্ট্রি" পেজে পাঠানো হয় না — শুধু আবার স্ক্যান করতে বলা হয়
      scanStatus.textContent = 'মিল পাওয়া যায়নি — লাল বক্সে NID নম্বর ও জন্মতারিখ দুটোই স্পষ্ট রেখে, স্থির হাতে, ভালো আলোয় আবার ক্যাপচার করো';
    }
  }catch(err){
    console.error(err);
    scanStatus.textContent = 'স্ক্যান ব্যর্থ, আবার চেষ্টা করো: ' + err.message;
  }finally{
    isScanning = false;
    scanShutterBtn.style.opacity='1'; scanShutterBtn.style.pointerEvents='auto';
  }
}

window.addEventListener('beforeunload', stopScanCamera);
</script>
