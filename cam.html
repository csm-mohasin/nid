<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Crop Web Camera</title>
  <style>
    :root{
      --bg-0:#05060B; --bg-1:#0A0E1C;
      --glass:rgba(255,255,255,0.045); --glass-brd:rgba(255,255,255,0.10);
      --ink:#EAF1FF; --ink-dim:#8C95B8;
      --violet:#8B6BFF; --violet-2:#5B3DFF;
      --cyan:#2FE1FF; --pink:#FF5FA8;
      --danger:#FF5D6C; --ok:#34E7A6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      background:
        radial-gradient(1100px 650px at 12% -8%, rgba(139,107,255,.20), transparent 60%),
        radial-gradient(900px 600px at 112% 6%, rgba(47,225,255,.12), transparent 55%),
        radial-gradient(800px 550px at 50% 118%, rgba(255,95,168,.10), transparent 58%),
        var(--bg-0);
    }

    @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
    @keyframes scanSweep{0%{transform:translateY(-110%);} 100%{transform:translateY(210%);}}
    @keyframes framePulse{0%,100%{box-shadow:0 0 0 9999px rgba(3,4,10,0.6), 0 0 0 0 rgba(139,107,255,.35);} 50%{box-shadow:0 0 0 9999px rgba(3,4,10,0.6), 0 0 24px 4px rgba(139,107,255,.28);}}

    h2 {
      font-size: 18px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, var(--violet-2), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: fadeUp .45s cubic-bezier(.2,.8,.2,1);
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--glass-brd);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      animation: fadeUp .5s cubic-bezier(.2,.8,.2,1);
    }

    video {
      width: 100%;
      display: block;
    }

    /* Standard Default Frame Border */
    .crop-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      height: 40%;
      border: 2px solid var(--cyan);
      border-radius: 8px;
      pointer-events: none;
      transition: width 0.05s ease, height 0.05s ease;
      animation: framePulse 2.4s ease-in-out infinite;
      overflow: hidden;
    }
    .crop-frame::after{
      content:''; position:absolute; left:0; right:0; height:2px;
      background: linear-gradient(90deg, transparent, var(--violet), transparent);
      animation: scanSweep 2.1s linear infinite;
    }

    .frame-tag {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--violet), var(--violet-2));
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(91,61,255,.4);
    }

    .controls {
      width: 100%;
      max-width: 480px;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeUp .55s cubic-bezier(.2,.8,.2,1);
    }

    .slider-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass);
      border: 1px solid var(--glass-brd);
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 14px;
      transition: border-color .2s;
    }
    .slider-container:focus-within{ border-color: var(--violet); }

    .slider-container input {
      width: 55%;
      accent-color: var(--violet);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    button {
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    button:active{ transform: scale(.96); }

    .btn-switch {
      background: var(--glass);
      border: 1px solid var(--glass-brd);
      color: var(--ink);
      flex: 1;
    }

    .btn-capture {
      background: linear-gradient(135deg, var(--violet), var(--violet-2));
      color: #ffffff;
      flex: 2;
      box-shadow: 0 8px 24px rgba(91,61,255,.4);
    }

    .btn-capture:active {
      opacity: 0.9;
    }

    .btn-reset {
      background: var(--glass);
      border: 1px solid var(--glass-brd);
      color: var(--danger);
      flex: 1;
    }

    .counter-info {
      text-align: center;
      font-size: 13px;
      color: var(--ink-dim);
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .case-input {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-brd);
      background: var(--glass);
      color: var(--ink);
      transition: border-color .2s, box-shadow .2s;
    }
    .case-input:focus{
      outline: none;
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(139,107,255,.16);
    }

    .case-input::placeholder {
      color: var(--ink-dim);
    }

    canvas {
      display: none;
    }

    .dev-credit {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .dev-credit span{ color: rgba(234,241,255,0.35); }
    .dev-credit a {
      text-decoration: none;
      font-weight: 800;
      background: linear-gradient(90deg, var(--violet-2), var(--cyan), var(--pink), var(--violet-2));
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: devCreditFade 6s ease-in-out infinite;
    }
    @keyframes devCreditFade{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }
  </style>
</head>
<body>

  <h2>Auto-Crop Document Camera</h2>

  <div class="camera-wrapper">
    <video id="webcam" autoplay playsinline></video>
    <div class="crop-frame" id="crop-frame">
      <span class="frame-tag">ফ্রেম সাইজ এডজাস্ট করুন</span>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="case-name" class="case-input" placeholder="Case নাম / নাম্বার লিখুন (যেমন: Case-1)" value="Case-1">

    <div class="slider-container">
      <label for="width-slider">Width (প্রস্থ):</label>
      <input type="range" id="width-slider" min="10" max="100" value="90">
    </div>

    <div class="slider-container">
      <label for="height-slider">Height (উচ্চতা):</label>
      <input type="range" id="height-slider" min="10" max="100" value="40">
    </div>

    <div class="btn-group">
      <button class="btn-switch" id="switch-btn">ক্যামেরা চেঞ্জ</button>
      <button class="btn-capture" id="capture-btn">ছবি তুলুন (Auto Crop)</button>
    </div>

    <div class="btn-group">
      <button class="btn-reset" id="reset-btn">নাম্বার রিসেট (১ থেকে শুরু)</button>
    </div>

    <div class="counter-info" id="counter-info">পরবর্তী ছবি: Case-1/1.jpg</div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="dev-credit"><span>Developer:</span> <a href="https://mohasin.bro.bd" target="_blank" rel="noopener">CSM Mohasin Alam</a></div>

  <script>
    const video = document.getElementById('webcam');
    const cropFrame = document.getElementById('crop-frame');
    const captureBtn = document.getElementById('capture-btn');
    const switchBtn = document.getElementById('switch-btn');
    const resetBtn = document.getElementById('reset-btn');
    const widthSlider = document.getElementById('width-slider');
    const heightSlider = document.getElementById('height-slider');
    const canvas = document.getElementById('canvas');
    const counterInfo = document.getElementById('counter-info');
    const caseNameInput = document.getElementById('case-name');

    let currentFacingMode = 'environment';
    let currentStream = null;

    // ক্রমিক নাম্বারিং এর জন্য কাউন্টার (1 থেকে শুরু হবে)
    let photoCounter = 1;

    // Case নাম থেকে ফোল্ডারে ব্যবহারযোগ্য নিরাপদ নাম বানানো হচ্ছে
    function getSafeCaseName() {
      const raw = caseNameInput.value.trim() || 'Case-1';
      return raw.replace(/[\\/:*?"<>|]/g, '-');
    }

    function updateCounterInfo() {
      counterInfo.textContent = 'পরবর্তী ছবি: ' + getSafeCaseName() + '/' + photoCounter + '.jpg';
    }

    // Case নাম পরিবর্তন করলে নাম্বার নতুন করে ১ থেকে শুরু হবে
    caseNameInput.addEventListener('input', () => {
      photoCounter = 1;
      updateCounterInfo();
    });

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        video.srcObject = currentStream;
      } catch (err) {
        alert('ক্যামেরা চালু করা যাচ্ছে না: ' + err.message);
      }
    }

    // Width এবং Height স্লাইডার চেঞ্জ লজিক
    widthSlider.addEventListener('input', (e) => {
      cropFrame.style.width = e.target.value + '%';
    });

    heightSlider.addEventListener('input', (e) => {
      cropFrame.style.height = e.target.value + '%';
    });

    switchBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      startCamera();
    });

    resetBtn.addEventListener('click', () => {
      photoCounter = 1;
      updateCounterInfo();
    });

    updateCounterInfo();

    captureBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;

      // ছবি তোলার সময় ছোট্ট flash অ্যানিমেশন — প্রতিটা ক্যাপচার ধাপে ভিজ্যুয়াল ফিডব্যাক
      const wrapper = document.querySelector('.camera-wrapper');
      wrapper.animate(
        [{ boxShadow: '0 0 0 0 rgba(47,225,255,0)' , filter:'brightness(1)'},
         { boxShadow: '0 0 40px 6px rgba(47,225,255,.55)', filter:'brightness(1.35)' },
         { boxShadow: '0 0 0 0 rgba(47,225,255,0)', filter:'brightness(1)' }],
        { duration: 320, easing: 'ease-out' }
      );

      const videoRect = video.getBoundingClientRect();
      const frameRect = cropFrame.getBoundingClientRect();

      const scaleX = video.videoWidth / videoRect.width;
      const scaleY = video.videoHeight / videoRect.height;

      const cropX = (frameRect.left - videoRect.left) * scaleX;
      const cropY = (frameRect.top - videoRect.top) * scaleY;
      const cropWidth = frameRect.width * scaleX;
      const cropHeight = frameRect.height * scaleY;

      canvas.width = cropWidth;
      canvas.height = cropHeight;

      const ctx = canvas.getContext('2d');

      ctx.drawImage(
        video,
        cropX, cropY, cropWidth, cropHeight,
        0, 0, cropWidth, cropHeight
      );

      const imageData = canvas.toDataURL('image/jpeg', 0.95);
      const downloadLink = document.createElement('a');

      // ছবি এখন "CaseName/1.jpg", "CaseName/2.jpg" এভাবে একটা সাব-ফোল্ডারে জমা হবে
      // (Downloads ফোল্ডারের ভিতরে Case নামের একটা ফোল্ডার তৈরি হবে - Chrome/Android এ কাজ করে)
      const caseName = getSafeCaseName();
      downloadLink.href = imageData;
      downloadLink.download = caseName + '/' + photoCounter + '.jpg';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      // পরবর্তী ছবির জন্য কাউন্টার বাড়ানো হলো
      photoCounter++;
      updateCounterInfo();
    });

    startCamera();
  </script>
</body>
</html>
